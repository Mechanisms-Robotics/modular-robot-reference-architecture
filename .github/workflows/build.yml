# Builds robot code and runs unit tests on every push and pull request.
# A red X on a PR means the code does not compile or a test fails —
# per team rules, do not merge red PRs.
name: Build

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 'build' compiles main + test sources and runs the unit tests.
      - name: Build and test
        run: ./gradlew build --no-daemon
